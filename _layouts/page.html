---
layout: default
---
<article class="page container">
  <header class="page__header">
    {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
    <h1 class="page__title">{{ page.title }}</h1>
    {% if page.lede %}<p class="page__lede">{{ page.lede }}</p>{% endif %}
  </header>
  {{ content }}
</article>
