# Team members, shown on the home page and the About page.
#
#   id:     Lowercase key. Devlog posts use it in `author:` front matter.
#   name:   Display name
#   role:   Short role line
#   neck:   Accent color for the pixel-pigeon avatar (used when there's no avatar image)
#   avatar: Optional image path, e.g. /assets/img/team/chibachi.png (square, pixel art looks best)
#   bio:    A few sentences. Markdown is allowed.
#   links:  Any number of { label, url } pairs

- id: chibachi
  name: chibachi
  role: Co-founder
  neck: "#7cff4f"
