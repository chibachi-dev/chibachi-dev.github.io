{% comment %}
  Responsive YouTube embed for devlog posts. Pass the video id (the part after "v=")
  and an optional title, e.g. include youtube.html id="abc123" title="Boss fight preview"
{% endcomment %}
<div class="video-embed">
  <iframe src="https://www.youtube-nocookie.com/embed/{{ include.id }}" title="{{ include.title | default: 'YouTube video' }}"
    loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
</div>
